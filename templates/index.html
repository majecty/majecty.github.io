{% extends "base.html" %}
{% block heading %}{% endblock %}
{% block content %}
{% set s = get_section(path="posts/_index.md") %}
<ul>
{% for p in s.pages %}
    <li><a href="{{ p.permalink }}">{{ p.title | safe }}</a> - {{ p.date | date(format="%Y년 %m월 %d일") }}</li>
{% endfor %}
</ul>
{% endblock %}
