{% extends "base.html" %}
{% block heading %}<h1>주제별 문서들</h1>{% endblock %}
{% block content %}

공부함에 따라 내용들이 자주 바뀔 수 있음.<br /><br />
<ul>

{% endfor %}
</ul>
{% endblock %}
